<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders Inbox — Retired</title>
    <meta http-equiv="refresh" content="5;url=/order-management.html">
    <link rel="stylesheet" href="/static/css/global-styles.css">
    <style>
        .tombstone-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .tombstone-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        .tombstone-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .tombstone-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        .tombstone-body {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 28px;
        }
        .tombstone-redirect {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="tombstone-container">
        <div class="tombstone-card">
            <div class="tombstone-icon">📦</div>
            <div class="tombstone-title">Orders Inbox has been retired</div>
            <div class="tombstone-body">
                The XML import pipeline has been replaced by direct ShipStation ingestion.
                Orders now sync automatically from ShipStation every 5 minutes.
                <br><br>
                Use <strong>Order Management</strong> to look up, audit, and reconcile orders.
            </div>
            <a href="/order-management.html" class="btn-primary" style="display: inline-block; padding: 12px 28px; border-radius: 8px; font-weight: 600; text-decoration: none;">
                Go to Order Management →
            </a>
            <div class="tombstone-redirect">Redirecting automatically in 5 seconds…</div>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
</body>
</html>
